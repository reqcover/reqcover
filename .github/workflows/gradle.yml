name: ReqCover CI/CD

on:
  push:
    tags:
      - '*'
    branches: [ trunk ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '**/README.md'
  pull_request:
    branches: [ trunk ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '**/README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.0
      with:
        cache: gradle
        distribution: 'zulu'
        java-version: '21'

    - name: Build and Test
      run: make

    - name: Upload Test Reports (if build fails)
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: test-reports
          path: '**/build/reports/tests/'

    - name: Deploy
      if: startsWith(github.ref, 'refs/tags/')
      run: make publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
